# Release pipeline: tag push -> per-target cross-compile from a single
# ubuntu-24.04 runner family -> single GitHub Release.
#
# Pattern: every target builds on linux-x86 using soldr's cargo front
# door. zigbuild handles Linux/macOS targets; xwin handles Windows-MSVC.
# Per-OS native runners are gone — same compiler, same flags, same
# linker semantics across every artifact, and we pay the cheaper
# linux-runner price tag for every job.
#
# Trigger contract:
#   * push tag v*                              -> full build + publish
#   * workflow_dispatch with dry-run: true     -> full build matrix, NO publish
#   * workflow_dispatch with dry-run: false    -> full build + publish
#
# Hardening:
#   * Build jobs run with `permissions: contents: read`. Only the publish
#     job gets `contents: write` — the bare minimum to attach assets.
#   * The publish job hard-fails if a release already exists for the tag.
#     Combined with the tag-protection ruleset, tags + releases are
#     write-once.
#   * Third-party `softprops/action-gh-release` pinned by full commit SHA.
#     `actions/checkout`, `actions/upload-artifact`,
#     `actions/download-artifact`, `zackees/setup-soldr`,
#     `mlugg/setup-zig`, and `taiki-e/install-action` pinned by major
#     version.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build all targets but skip GitHub Release publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
          # musl targets: fully-static linux binaries (Alpine-compatible).
          # zigbuild handles both glibc and musl in one toolchain; the
          # old apt `musl-tools` install + per-host runner split is gone.
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
          - target: x86_64-pc-windows-msvc
            archive: zip
            tool: xwin
            cargo_tool_install: cargo-xwin
          - target: aarch64-pc-windows-msvc
            archive: zip
            tool: xwin
            cargo_tool_install: cargo-xwin
          - target: x86_64-apple-darwin
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
          - target: aarch64-apple-darwin
            archive: tar.gz
            tool: zigbuild
            cargo_tool_install: cargo-zigbuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup soldr
        uses: zackees/setup-soldr@v0.9.24
        with:
          toolchain: "1.94.1"
          version: "0.7.59"
          cache: true
          build-cache-mode: thin
          # platform-default opts out of setup-soldr's `fast` linker
          # override (mold/rust-lld). Cross-compile lanes need zigbuild's
          # zig-cc toolchain to own the linker — otherwise SOLDR_LINKER
          # injects rust-lld which defaults to the host arch (x86_64) and
          # fails to link aarch64 object files. The xwin lane gets its
          # MSVC linker config from soldr's cargo front door regardless.
          linker: platform-default

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # Pre-install cargo-zigbuild / cargo-xwin via taiki-e/install-action.
      # Placing them on PATH up front lets soldr's cargo front door take
      # its PATH-first deferral branch (avoids fanning out unauthenticated
      # GitHub API calls across an 8-target matrix and getting 403'd).
      - name: Install cross-compile cargo subcommand
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ matrix.cargo_tool_install }}

      - name: Install zig (zigbuild lanes only)
        if: matrix.tool == 'zigbuild'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      # llvm-strip is universal: works on ELF (linux), Mach-O (darwin).
      # `zip` is needed for the windows-msvc archive path.
      - name: Install llvm + zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm zip

      - name: Cross-compile release binary
        shell: bash
        run: |
          set -euo pipefail
          # cargo-zigbuild accepts `cargo zigbuild --release ...` directly
          # (zigbuild treats the absence of a subverb as `build`), but
          # cargo-xwin requires the explicit `build` subverb before flags.
          if [ "${{ matrix.tool }}" = "xwin" ]; then
            soldr cargo xwin build --release --bin meta-hook --target "${{ matrix.target }}"
          else
            soldr cargo zigbuild --release --bin meta-hook --target "${{ matrix.target }}"
          fi

      - name: Resolve version + paths
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF##*/}"
            version="${ref#v}"
          else
            # workflow_dispatch (dry-run or manual republish from main):
            # derive version from Cargo.toml so artifact naming stays sane.
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
            [ -z "$version" ] && version="dryrun-${GITHUB_SHA::8}"
          fi
          stem="meta-hook-v${version}-${{ matrix.target }}"
          bin="meta-hook"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            bin="meta-hook.exe"
          fi
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "stem=$stem"         >> "$GITHUB_OUTPUT"
          echo "bin_name=$bin"      >> "$GITHUB_OUTPUT"
          echo "bin_path=target/${{ matrix.target }}/release/$bin" >> "$GITHUB_OUTPUT"

      - name: Strip binary (Linux/macOS targets)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          # llvm-strip handles every triple in the non-Windows lanes
          # (ELF for linux, Mach-O for darwin). No per-arch strip tool
          # needed when everything is cross-compiled from one host.
          llvm-strip "${{ steps.vars.outputs.bin_path }}"

      - name: Stage artifact
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          stem="${{ steps.vars.outputs.stem }}"
          stage="dist/$stem"
          mkdir -p "$stage"
          cp "${{ steps.vars.outputs.bin_path }}" "$stage/${{ steps.vars.outputs.bin_name }}"
          cp LICENSE "$stage/LICENSE"
          cp README.md "$stage/README.md"
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            archive="$stem.zip"
            zip -r "$archive" "$stem" >/dev/null
          else
            archive="$stem.tar.gz"
            tar -czf "$archive" "$stem"
          fi
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=dist/$archive"         >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.stem }}
          path: |
            ${{ steps.stage.outputs.archive }}
            ${{ steps.stage.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    # Skip publish for dry-run dispatches. Push events (tag-driven)
    # always publish; manual workflow_dispatch publishes only when
    # dry-run is false.
    if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          tag="${GITHUB_REF##*/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Hard-fail if a release already exists for this tag. Combined
      # with the tag-protection ruleset (no force-update on
      # `refs/tags/v*`), this enforces "tags + releases are write-once."
      - name: Guard against republish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version and tag a new release; tags + releases are write-once."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage release assets
        id: stage
        run: |
          mkdir -p release
          # Each artifact is a directory; flatten archive + sha256 into release/.
          find dist -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -print0 \
            | xargs -0 -I{} cp {} release/
          ls -la release

      - name: Publish GitHub Release
        # softprops/action-gh-release v3.0.0 — pinned by full commit SHA.
        # Build jobs are still read-only; only this job has `contents: write`.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
