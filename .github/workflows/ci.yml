# Continuous integration: fmt / clippy / test on every push to every branch.
#
# Triggered on push only (no `pull_request`) to mirror clud's convention and
# avoid double-runs when a feature branch is opened as a PR — the push event
# already covers it.
#
# Permissions are pinned to read at the workflow level. CI never writes to
# the repo, the release pipeline lives in release.yml and uses its own
# narrower scope.

name: CI

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15
          - macos-15-intel
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zackees/setup-soldr@v0 is pinned to a specific SHA because the
      # floating `v0` tag was rewritten to a Node20 TypeScript port that
      # silently drops `components` from rust-toolchain.toml, leaving
      # rustfmt/clippy missing. See zackees/setup-soldr#76. The clud repo
      # adopted this exact pin for the same reason.
      - name: Setup soldr
        uses: zackees/setup-soldr@8bc6da394b8ad370654826a0b3d8f5e3615d10d6 # v0 (pre-Node20-rewrite)
        with:
          toolchain: "1.94.1"
          version: "0.7.11"
          cache: true
          build-cache-mode: thin

      - name: cargo fmt --check
        run: soldr cargo fmt --all -- --check

      - name: cargo clippy
        run: soldr cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: soldr cargo test --all
